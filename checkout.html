  <script>
    function handleLogoFallback() {
      var logoImg = document.getElementById('business-logo');
      var logoText = document.getElementById('logo-text-fallback');
      if (logoImg) {
        if (logoImg.src.indexOf('assets/images/logo.png') !== -1) {
          // assets/images path failed — try root fallback
          logoImg.src = 'logo.png';
        } else {
          // If both fail, hide image and show elegant serif text fallback
          logoImg.style.display = 'none';
          if (logoText) {
            logoText.style.display = 'block';
          }
        }
      }
    }
  </script>

    <script>
      
      window.toggleShippingSame = function() {
          var chk = document.getElementById('billing-same');
          var flds = document.getElementById('shipping-address-fields');
          if (chk && flds) {
              flds.style.display = chk.checked ? 'none' : 'block';
          }
      };

      window.toggleFulfillment = function() {
        var val = document.querySelector('input[name="fulfillment_method"]:checked').value;
        var pickupGroup = document.getElementById('pickup-details');
        var shippingGroup = document.getElementById('shipping-address-group');
        
        if (val === 'pickup') {
          if (pickupGroup) pickupGroup.style.display = 'block';
          if (shippingGroup) shippingGroup.style.display = 'none';
        } else {
          if (pickupGroup) pickupGroup.style.display = 'none';
          if (shippingGroup) shippingGroup.style.display = 'block';
        }
        
        if (typeof updateTotalDisplay === 'function') {
          updateTotalDisplay();
        }
      };
      window.applyDiscount = function() {
        const codeInput = document.getElementById('discount-code');
        const msgDiv = document.getElementById('discount-msg');
        if (!codeInput || !msgDiv) return;
        
        const code = codeInput.value.trim().toUpperCase();
        if (!code) {
          msgDiv.textContent = 'Please enter a code.';
          msgDiv.style.color = '#e27b7b';
          return;
        }
        
        msgDiv.textContent = 'Validating...';
        msgDiv.style.color = 'var(--color-sage)';
        
        fetch('validate_discount.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({code: code})
        })
        .then(res => res.json())
        .then(data => {
          if (data.valid && data.discount) {
            window.appliedDiscount = data.discount;
            window.appliedDiscount.code = code;
            
            let currentFulfillMethod = document.querySelector('input[name="fulfillment_method"]:checked');
            let currentFulfillVal = currentFulfillMethod ? currentFulfillMethod.value : 'shipping';
            let restriction = data.discount.restriction || 'all';
            
            if (restriction !== 'all' && restriction !== currentFulfillVal) {
              msgDiv.textContent = 'This code is only valid for ' + (restriction === 'pickup' ? 'local pickup' : 'shipping') + ' orders.';
              msgDiv.style.color = '#e27b7b';
            } else {
              msgDiv.textContent = 'Discount applied successfully!';
              msgDiv.style.color = '#a2e0a2';
            }

            if (typeof updateTotalDisplay === 'function') {
              updateTotalDisplay();
            }
          } else {
            window.appliedDiscount = null;
            msgDiv.textContent = data.error || 'Invalid code.';
            msgDiv.style.color = '#e27b7b';
            if (typeof updateTotalDisplay === 'function') {
              updateTotalDisplay();
            }
          }
        })
        .catch(err => {
          console.error(err);
          msgDiv.textContent = 'Error validating code.';
          msgDiv.style.color = '#e27b7b';
        });
      };

    </script>
  
    <script>
      function enforcePickupRules() {
        const pickupInput = document.getElementById('pickup-time');
        if (!pickupInput) return;

        function getEarliestPickupTime() {
            let now = new Date();
            let currentHour = now.getHours();
            let currentMinute = now.getMinutes();
            let target = new Date(now.getTime());
            
            // If Sunday, move to Monday 10 AM
            if (target.getDay() === 0) {
                target.setDate(target.getDate() + 1);
                target.setHours(10, 0, 0, 0);
                return target;
            }
            
            // If before 7:00 AM, earliest is 10:00 AM today
            if (currentHour < 7) {
                target.setHours(10, 0, 0, 0);
                return target;
            }
            
            // If strictly after 3:00 PM, move to 10 AM next valid day
            if (currentHour > 15 || (currentHour === 15 && currentMinute > 0)) {
                let addDays = target.getDay() === 6 ? 2 : 1; // Skip Sunday if today is Saturday
                target.setDate(target.getDate() + addDays);
                target.setHours(10, 0, 0, 0);
                return target;
            }
            
            // Otherwise, it's between 7 AM and 3 PM -> +3 hours
            target = new Date(target.getTime() + (3 * 60 * 60 * 1000));
            return target;
        }

        function toLocalISOString(date) {
            let tzoffset = date.getTimezoneOffset() * 60000;
            return (new Date(date.getTime() - tzoffset)).toISOString().slice(0,16);
        }

        // 1. Set the hard minimum limit dynamically on page load
        const earliest = getEarliestPickupTime();
        pickupInput.min = toLocalISOString(earliest);

        // 2. Add strict logic if user types or selects invalid data
        pickupInput.addEventListener('change', function() {
            let selectedDate = new Date(this.value);
            if (isNaN(selectedDate.getTime())) return;

            let day = selectedDate.getDay();
            let hours = selectedDate.getHours();
            let minutes = selectedDate.getMinutes();

            // Check Sundays
            if (day === 0) {
                alert("We are closed for pickups on Sundays. Please select a time between Monday and Saturday.");
                this.value = '';
                return;
            }

            // Check Time Window (10:00 AM to 6:00 PM)
            let timeVal = hours + (minutes/60);
            if (timeVal < 10 || timeVal > 18) {
                alert("Pickup times are strictly between 10:00 AM and 6:00 PM.");
                this.value = '';
                return;
            }

            // Check Minimum 3-Hour Notice
            if (selectedDate < getEarliestPickupTime()) {
                alert("Orders require a minimum 3-hour preparation window. The earliest available pickup time is " + getEarliestPickupTime().toLocaleString([], {weekday:'short', hour: '2-digit', minute:'2-digit'}));
                this.value = toLocalISOString(getEarliestPickupTime());
                return;
            }
        });
      }

      document.addEventListener('DOMContentLoaded', enforcePickupRules);
    </script>

      var glow = document.getElementById('cursor-glow');
      if (glow) {
        document.addEventListener('mousemove', function(e) {
          glow.style.left = e.clientX + 'px';
          glow.style.top = e.clientY + 'px';
        }, {passive: true});
      }
      
      // Render Cart Items immediately in the summary panel
      renderCheckoutSummary();

      // Tipping option handler
      const tipBtns = document.querySelectorAll('.tip-btn');
      const customTipInput = document.getElementById('custom-tip-input');

      tipBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          tipBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const tipVal = btn.dataset.tip;
          if (tipVal === 'custom') {
            customTipInput.style.display = 'block';
            window.tipAmount = parseFloat(customTipInput.value) || 0.0;
          } else {
            customTipInput.style.display = 'none';
            const percent = parseFloat(tipVal);
            window.tipAmount = (window.cartSubtotal * percent) / 100.0;
          }
          updateTotalDisplay();
        });
      });

      customTipInput?.addEventListener('input', function() {
        window.tipAmount = parseFloat(customTipInput.value) || 0.0;
        updateTotalDisplay();
      });
    });


    function updateCartQty(id, change) {
      let cart = {};
      try { cart = JSON.parse(localStorage.getItem('hw_cart') || '{}'); } catch(e) { return; }
      if (cart[id]) {
        cart[id].qty += change;
        if (cart[id].qty <= 0) {
          delete cart[id];
        }
        localStorage.setItem('hw_cart', JSON.stringify(cart));
        renderCheckoutSummary();
      }
    }

    function renderCheckoutSummary() {
        const list = document.getElementById('checkout-cart-list');
        const totalEl = document.getElementById('checkout-cart-total');
        if (!list || !totalEl) return;
  
        let cart = {};
        try {
          cart = JSON.parse(localStorage.getItem('hw_cart') || '{}');
        } catch (e) {
          cart = {};
        }
        
        // Fetch products to validate cart against live rules (Out of Stock / Archived)
        fetch('products.json?nocache=' + new Date().getTime())
          .then(res => {
            if (!res.ok) throw new Error('Could not fetch products');
            return res.json();
          })
          .then(products => {
            let updated = false;
            let keys = Object.keys(cart);
            for (let i = 0; i < keys.length; i++) {
              let id = keys[i];
              let p = products.find(x => x.id === id || x.square_variation_id === id);
              if (p) {
                // Rule 1: Manual out of stock
                if (p.inStock === false) {
                  delete cart[id];
                  updated = true;
                  continue;
                }
                // Rule 3 & 4: Hidden/Archived Items (except formulators collective)
                var isCollective = p.id.indexOf('formulators-collective') !== -1 || (p.cat && p.cat.indexOf('collective') !== -1);
                var isVisible = p.visibility === 'visible' && (!p.ecom_visibility || p.ecom_visibility.toUpperCase() === 'VISIBLE') && (p.is_archived !== true && p.is_archived !== 'true');
                if (!isVisible && !isCollective) {
                  delete cart[id];
                  updated = true;
                }
              }
            }
            if (updated) {
              localStorage.setItem('hw_cart', JSON.stringify(cart));
              alert('One or more items in your cart are no longer available and have been removed.');
            }
            _drawCart(cart, list, totalEl);
          })
          .catch(err => {
            console.warn('Cart validation skipped due to network error:', err);
            _drawCart(cart, list, totalEl);
          });
      }

      function _drawCart(cart, list, totalEl) {
        const keys = Object.keys(cart);
        if (keys.length === 0) {
          list.innerHTML = '<div style="text-align:center;color:var(--color-purple);padding:var(--space-12) 0;">Your cart is empty. Please add items to checkout.</div>';
          totalEl.textContent = '$0.00';
          updateTotalDisplay();
          return;
        }
  
        let subtotal = 0.0;
        list.innerHTML = keys.map(k => {
          const item = cart[k];
          const lineTotal = item.price * item.qty;
          subtotal += lineTotal;
          return `
            <div class="cart-summary-item">
              <div class="item-details">
                <span class="item-name">${item.name}</span>
                <span class="item-meta">Qty: ${item.qty} &middot; ${item.price.toFixed(2)}</span>
              </div>
              <span class="item-price">${lineTotal.toFixed(2)}</span>
            </div>
          `;
        }).join('');
  
        window.cartSubtotal = subtotal;
        updateTotalDisplay();
      }

    function updateTotalDisplay() {
        const totalEl = document.getElementById('checkout-cart-total');
        const breakdownEl = document.getElementById('checkout-summary-breakdown');
        if (!totalEl) return;
        
        const list = document.getElementById('checkout-cart-list');
        const cartObj = JSON.parse(localStorage.getItem('hw_cart') || '{}');
        const keys = Object.keys(cartObj);
        
        if (keys.length > 0 && window.tipAmount > 0) {
          let tipRow = document.getElementById('checkout-summary-tip-row');
          if (!tipRow) {
            tipRow = document.createElement('div');
            tipRow.id = 'checkout-summary-tip-row';
            tipRow.className = 'cart-summary-item';
            tipRow.style.borderTop = '1px dashed rgba(255,255,255,0.1)';
            tipRow.style.marginTop = 'var(--space-2)';
            tipRow.style.paddingTop = 'var(--space-2)';
            list.appendChild(tipRow);
          }
          tipRow.innerHTML = `
            <div class="item-details">
              <span class="item-name" style="color: var(--color-amber);">Formulator Tip Support</span>
              <span class="item-meta">Thank you!</span>
            </div>
            <span class="item-price" style="color: var(--color-amber);">${window.tipAmount.toFixed(2)}</span>
          `;
        } else {
          let tipRow = document.getElementById('checkout-summary-tip-row');
          if (tipRow) tipRow.remove();
        }

        let discountAmount = 0.0;
        const msgDiv = document.getElementById('discount-msg');
        let discountValid = true;
        
        // Determine current fulfillment method for restriction check
        let currentFulfillMethod = document.querySelector('input[name="fulfillment_method"]:checked');
        let currentFulfillVal = currentFulfillMethod ? currentFulfillMethod.value : 'shipping';

        if (window.appliedDiscount) {
            let restriction = window.appliedDiscount.restriction || 'all';
            if (restriction !== 'all' && restriction !== currentFulfillVal) {
                discountValid = false;
                if (msgDiv) {
                    msgDiv.textContent = 'This code is only valid for ' + (restriction === 'pickup' ? 'local pickup' : 'shipping') + ' orders.';
                    msgDiv.style.color = '#e27b7b';
                }
            } else {
                if (msgDiv && msgDiv.textContent.indexOf('only valid') !== -1) {
                    msgDiv.textContent = 'Discount applied successfully!';
                    msgDiv.style.color = '#a2e0a2';
                }
            }

            if (discountValid) {
                if (window.appliedDiscount.type === 'percent') {
                    discountAmount = window.cartSubtotal * (window.appliedDiscount.value / 100.0);
                } else {
                    discountAmount = window.appliedDiscount.value;
                }
            }
        }
        
        let subAfterDiscount = Math.max(0, window.cartSubtotal - discountAmount);
        
        // Count total items
        let totalItemCount = 0;
        for (let k of keys) {
            totalItemCount += cartObj[k].qty || 1;
        }

        // Determine Shipping Fee
        let fulfillMethod = document.querySelector('input[name="fulfillment_method"]:checked');
        window.shippingFee = 0.00;
        
        if (fulfillMethod && fulfillMethod.value === 'shipping') {
            if (subAfterDiscount >= 45.00) {
                window.shippingFee = 0.00;
            } else {
                if (totalItemCount <= 2) {
                    window.shippingFee = 6.50;
                } else if (totalItemCount <= 5) {
                    window.shippingFee = 10.50;
                } else {
                    window.shippingFee = 14.50;
                }
            }
        }
        
        // Calculate MD State Tax (6%) on Subtotal+Shipping
        window.taxAmount = subAfterDiscount * 0.06;
        
        const finalTotal = subAfterDiscount + window.taxAmount + window.shippingFee + window.tipAmount;
        
        if (breakdownEl) {
            let breakdownHtml = `
                <div style="display:flex; justify-content:space-between;">
                    <span>Subtotal</span>
                    <span>${window.cartSubtotal.toFixed(2)}</span>
                </div>
            `;
            if (discountAmount > 0) {
                breakdownHtml += `
                <div style="display:flex; justify-content:space-between; color: var(--color-sage);">
                    <span>Discount</span>
                    <span>-${discountAmount.toFixed(2)}</span>
                </div>`;
            }
            if (fulfillMethod && fulfillMethod.value === 'shipping') {
                if (window.shippingFee === 0) {
                    breakdownHtml += `
                    <div style="display:flex; justify-content:space-between; color: var(--color-amber);">
                        <span>Shipping</span>
                        <span>FREE</span>
                    </div>`;
                } else {
                    breakdownHtml += `
                    <div style="display:flex; justify-content:space-between;">
                        <span>Shipping</span>
                        <span>${window.shippingFee.toFixed(2)}</span>
                    </div>`;
                }
            }
            breakdownHtml += `
            <div style="display:flex; justify-content:space-between;">
                <span>Tax (MD 6%)</span>
                <span>${window.taxAmount.toFixed(2)}</span>
            </div>`;
            
            breakdownEl.innerHTML = breakdownHtml;
        }

        totalEl.textContent = `${finalTotal.toFixed(2)}`;
      }
  </script>
</body>
</html>
