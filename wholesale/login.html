<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Login | Herbalistic Wellness</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh;">
    <div style="background:white; padding:40px; border-radius:8px; border: 1px solid var(--color-purple); text-align:center; max-width:400px;">
        <h2 style="margin-top:0;">Wholesale Partner Access</h2>
        <p>Please log in with your approved wholesale credentials to access bulk pricing and ordering.</p>
        <input type="email" placeholder="Email Address" style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box;">
        <input type="password" placeholder="Password" style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box;">
        <button class="button" style="width:100%;" onclick="mockLogin()">Login to Wholesale</button>
        <div style="border-top: 1px solid #ccc; margin-top: 20px; padding-top: 20px;">
            <p style="font-size:0.9em; margin-bottom: 10px;">Not a partner yet?</p>
            <a href="/wholesale/apply" style="display:block; padding:10px; background:#482C6A; color:white; text-decoration:none; border-radius:4px;">Wholesale Partnership Application</a>
        </div>
    </div>

    <script>
        function mockLogin() {
            localStorage.setItem('hw_role', 'wholesale');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
