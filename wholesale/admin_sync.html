<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Inventory Sync | Herbalistic Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    <header class="bg-[#482C6A] text-[#FAF9F6] sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4"><div class="flex justify-between items-center h-16"><span class="font-heading text-2xl">Wholesale Admin Interface</span><a href="/wholesale/admin" class="text-[#D88C43]">Admin Home</a></div></div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
        <div class="bg-white p-6 rounded shadow-sm border-t-4 border-[#482C6A]">
            <h2 class="font-heading text-2xl text-[#482C6A] mb-4">Inventory Sync Configuration</h2>
            <p class="text-sm text-gray-600 mb-6">Manage Google Sheets and Firebase Webhook synchronizations for live inventory tracking.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block font-semibold mb-1 text-sm">Google Sheets Webhook URL</label>
                    <input type="text" value="https://script.google.com/macros/s/AKfycbz_wholesale_webhook/exec" class="w-full border rounded p-2 bg-gray-50 text-gray-700" readonly>
                </div>
                <div>
                    <label class="block font-semibold mb-1 text-sm">Firebase Sync Status</label>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-green-500"></span>
                        <span class="text-green-700 font-medium">Connected & Active</span>
                    </div>
                </div>
                <div class="pt-4 border-t">
                    <button class="bg-[#D88C43] text-white px-6 py-2 rounded shadow hover:bg-opacity-90" onclick="this.textContent='Pinging Webhook...'; setTimeout(() => { this.textContent='Sync Completed ✓'; this.classList.replace('bg-[#D88C43]', 'bg-green-600'); }, 1500)">Force Manual Sync</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
